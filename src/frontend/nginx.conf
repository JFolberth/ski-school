log_format frontend '$request_method $uri $status $body_bytes_sent';

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    access_log /dev/stdout frontend;
    error_log /dev/stderr error;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location = /healthz {
        access_log off;
        proxy_connect_timeout 2s;
        proxy_read_timeout 2s;
        proxy_pass http://127.0.0.1:8089/healthz;
    }

    location = /deployment.json {
        alias /tmp/deployment.json;
        default_type application/json;
        expires -1;
    }

    location /api/ {
        client_max_body_size 24k;
        proxy_set_header Host $http_host;
        proxy_pass http://127.0.0.1:8089;
        proxy_read_timeout 310s;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
