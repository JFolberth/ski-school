name: Publish Terraform deployment source
description: Publish root configuration and bundled actions bound to the shared modules artifact after successful CI.
inputs:
  terraform-root:
    description: Repository-relative Terraform root to publish.
    required: true
  modules-artifact-id:
    description: Immutable shared modules artifact verified by CI.
    required: true
  modules-artifact-digest:
    description: SHA-256 digest of the shared modules archive verified by CI.
    required: true
  name:
    description: Run-specific artifact name.
    required: true
  state-key:
    description: Approved root-specific backend key.
    required: true
  environments:
    description: Full approved environment target array, including isolated backends and expected resource groups.
    required: true
  retention-days:
    description: Artifact retention in days.
    default: "7"
outputs:
  artifact-id:
    description: Immutable source artifact ID.
    value: ${{ steps.upload.outputs.artifact-id }}
  artifact-digest:
    description: SHA-256 digest of the immutable source archive.
    value: ${{ steps.upload.outputs.artifact-digest }}
runs:
  using: composite
  steps:
    - name: Stage allowlisted deployment source
      id: source
      shell: bash
      env:
        STATE_KEY: ${{ inputs.state-key }}
        ENVIRONMENTS: ${{ inputs.environments }}
        TF_ROOT: ${{ inputs.terraform-root }}
        MODULES_ARTIFACT_ID: ${{ inputs.modules-artifact-id }}
        MODULES_ARTIFACT_DIGEST: ${{ inputs.modules-artifact-digest }}
      run: |
        set -euo pipefail
        directory=$(mktemp -d "$RUNNER_TEMP/terraform-source.XXXXXX")
        trap 'rm -rf -- "$directory"' ERR
        export SOURCE_DIRECTORY="$directory"
        python3 - <<'PY'
        import json
        import os
        from pathlib import Path
        import re
        import shutil
        import subprocess

        root = Path(os.environ["GITHUB_WORKSPACE"]).resolve()
        destination = Path(os.environ["SOURCE_DIRECTORY"])
        terraform_root = Path(os.environ["TF_ROOT"])
        if (terraform_root.is_absolute() or ".." in terraform_root.parts
                or terraform_root.as_posix() in ("", ".")
                or terraform_root.as_posix() != os.environ["TF_ROOT"]
                or (root / terraform_root).resolve() != root / terraform_root
                or not (root / terraform_root).is_dir()):
            raise SystemExit("Source root must be a canonical repository-relative directory without symlinks.")
        if (not re.fullmatch(r"[0-9]+", os.environ["MODULES_ARTIFACT_ID"]) or
                not re.fullmatch(r"[a-f0-9]{64}", os.environ["MODULES_ARTIFACT_DIGEST"])):
            raise SystemExit("Require the exact shared modules artifact ID and digest.")
        environments = json.loads(os.environ["ENVIRONMENTS"])
        if not isinstance(environments, list) or not environments:
            raise SystemExit("Require a nonempty environment manifest.")
        if any(not isinstance(target, dict) or
               not isinstance(target.get("name"), str) or
               not re.fullmatch(r"[a-z]{3}", target["name"]) for target in environments):
            raise SystemExit("Invalid environment name in source manifest.")
        actions = {
            f".github/actions/{name}/action.yml"
            for name in ("terraform-fmt", "terraform-validate", "terraform-plan-artifact")
        }
        required = actions | {
            (terraform_root / "main.tf").as_posix(),
            (terraform_root / ".terraform.lock.hcl").as_posix(),
        } | {(terraform_root / f'{target["name"]}.tfvars').as_posix() for target in environments}
        tracked = subprocess.check_output(["git", "ls-files", "-z"], cwd=root).decode().split("\0")
        files = sorted(path for path in tracked if path and (
            path in required
            or (Path(path).parent == terraform_root and path.endswith(".tf"))
        ))
        if not required.issubset(files):
            raise SystemExit("Required Terraform source, lockfile, variable file, or local action is missing.")
        if subprocess.check_output(["git", "rev-parse", "HEAD"], cwd=root, text=True).strip() != os.environ["GITHUB_SHA"]:
            raise SystemExit("Publisher checkout does not match the triggering revision.")
        for path in files:
            source = root / path
            if source.is_symlink() or source.resolve() != source or not source.is_file():
                raise SystemExit("Source bundle cannot contain symlinks or non-regular files.")
            target = destination / path
            target.parent.mkdir(parents=True, exist_ok=True)
            shutil.copyfile(source, target)
        provenance = {
            "repository": os.environ["GITHUB_REPOSITORY"],
            "sha": os.environ["GITHUB_SHA"],
            "run_id": os.environ["GITHUB_RUN_ID"],
            "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
            "environments": environments,
            "state_key": os.environ["STATE_KEY"],
            "modules": {
                "artifact_id": os.environ["MODULES_ARTIFACT_ID"],
                "artifact_digest": os.environ["MODULES_ARTIFACT_DIGEST"],
            },
            "files": files,
        }
        (destination / "provenance.json").write_text(json.dumps(provenance, sort_keys=True) + "\n")
        PY
        echo "directory=$directory" >> "$GITHUB_OUTPUT"

    - name: Publish source once
      id: upload
      uses: ./.github/actions/upload-artifact
      with:
        name: ${{ inputs.name }}
        path: ${{ steps.source.outputs.directory }}
        retention-days: ${{ inputs.retention-days }}
        include-hidden-files: "true"

    - name: Remove staged source
      if: ${{ always() && steps.source.outputs.directory != '' }}
      shell: bash
      env:
        DIRECTORY: ${{ steps.source.outputs.directory }}
      run: |
        if [[ -L "$DIRECTORY" || "${DIRECTORY##*/}" != terraform-source.* ||
          "$(dirname -- "$DIRECTORY")" != "$(realpath -e -- "$RUNNER_TEMP")" ]]; then
          echo "::error::Refusing cleanup outside the owned source directory."
          exit 1
        fi
        rm -rf -- "$DIRECTORY"
