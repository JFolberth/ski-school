name: Check Terraform formatting
description: Check formatting recursively across the infrastructure directory.
runs:
  using: composite
  steps:
    - name: Check infrastructure formatting
      shell: bash
      run: |
        if ! terraform fmt -check -recursive infra; then
          printf '\n### Terraform formatting failed\n\nRun %s and review the resulting changes.\n' \
            "\`terraform fmt -recursive infra\`" >> "$GITHUB_STEP_SUMMARY"
          exit 1
        fi
