name: Build image artifact
description: Build, load, and upload a Docker-loadable image archive.

inputs:
  image-name:
    description: Label used in the uploaded artifact name.
    required: true
  context:
    description: Repository-relative Docker build context.
    required: true
  dockerfile:
    description: Repository-relative Dockerfile path.
    required: true
  image-tag:
    description: Tag assigned to the built image.
    required: true
  build-args:
    description: Newline-delimited Docker build arguments.
    default: ''
  artifact-prefix:
    description: Prefix used in the uploaded artifact name.
    default: ci
  retention-days:
    description: Number of days to retain the uploaded artifact.
    default: '7'

outputs:
  image-id:
    description: Docker image ID of the loaded image.
    value: ${{ steps.load.outputs.image-id }}
  artifact-id:
    description: ID of the uploaded image artifact.
    value: ${{ steps.upload.outputs.artifact-id }}
  artifact-digest:
    description: SHA-256 digest of the image archive artifact.
    value: ${{ steps.upload.outputs.artifact-digest }}

runs:
  using: composite
  steps:
    - name: Prepare build paths and temporary output directory
      id: prepare
      shell: bash
      env:
        INPUT_CONTEXT: ${{ inputs.context }}
        INPUT_DOCKERFILE: ${{ inputs.dockerfile }}
        RUNNER_TEMP_PATH: ${{ runner.temp }}
      run: |
        set -euo pipefail
        workspace=$(realpath -e -- "$GITHUB_WORKSPACE")
        context=$(realpath -e -- "$workspace/$INPUT_CONTEXT")
        dockerfile=$(realpath -e -- "$workspace/$INPUT_DOCKERFILE")
        [[ "$context" == "$workspace/"* && -d "$context" &&
          "$dockerfile" == "$workspace/"* && -f "$dockerfile" &&
          "$context$dockerfile" != *$'\n'* && "$context$dockerfile" != *$'\r'* ]] || {
          echo "::error::Build paths must resolve inside the repository without line breaks."
          exit 1
        }

        runner_temp=$(realpath -e -- "$RUNNER_TEMP_PATH")
        output_dir=$(mktemp -d "$runner_temp/ci-image.XXXXXX")
        {
          printf 'context=%s\n' "$context"
          printf 'dockerfile=%s\n' "$dockerfile"
          printf 'output-directory=%s\n' "$output_dir"
        } >> "$GITHUB_OUTPUT"

    - uses: docker/setup-buildx-action@v4

    - name: Build and export image
      uses: docker/build-push-action@v7
      env:
        DOCKER_BUILD_RECORD_UPLOAD: 'false'
      with:
        context: ${{ steps.prepare.outputs.context }}
        file: ${{ steps.prepare.outputs.dockerfile }}
        build-args: ${{ inputs.build-args }}
        platforms: linux/amd64
        push: false
        tags: ${{ inputs.image-tag }}
        outputs: type=docker,dest=${{ steps.prepare.outputs.output-directory }}/image.tar

    - name: Load image
      id: load
      shell: bash
      env:
        OUTPUT_DIRECTORY: ${{ steps.prepare.outputs.output-directory }}
        IMAGE_TAG: ${{ inputs.image-tag }}
      run: |
        set -euo pipefail
        docker load --input "$OUTPUT_DIRECTORY/image.tar"
        # Buildx reports the config digest, which can differ from Docker's loaded image ID.
        image_id=$(docker image inspect --format '{{.Id}}' "$IMAGE_TAG")
        printf 'image-id=%s\n' "$image_id" >> "$GITHUB_OUTPUT"

    - name: Upload image archive
      id: upload
      uses: ./.github/actions/upload-artifact
      with:
        name: ${{ inputs.artifact-prefix }}-${{ inputs.image-name }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ steps.prepare.outputs.output-directory }}/image.tar
        compression-level: 0
        retention-days: ${{ inputs.retention-days }}
