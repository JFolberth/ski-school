name: Check Terraform plan
description: Plan against existing remote state and optionally apply the verified private plan on main.
inputs:
  terraform-root:
    description: Repository-relative Terraform root.
    default: infra/frontend
  environment:
    description: Environment selecting the root-local tfvars.
    default: dev
  state-account:
    description: Existing environment-isolated backend storage account.
    required: true
  state-container:
    description: Existing state container.
    required: true
  state-key:
    description: Existing root-specific state key.
    required: true
  require-session-signing-key:
    description: Require the frontend runtime secret for frontend plans.
    default: "true"
  require-existing-state:
    description: Require an existing authenticated backend blob before initialization; never migrate state automatically.
    default: "false"
  expected-resource-group:
    description: Resource group to verify for a root with guarded deployment; required for apply.
    default: ""
  apply:
    description: Apply the guarded saved plan if it has changes; allowed only on a main push.
    default: "false"
  image-digest:
    description: Published container image digest for apply when the Terraform root requires one.
    default: ""
  bridge-image-digest:
    description: Published bridge image digest for frontend apply.
    default: ""
  foundry-agent-url:
    description: Optional Foundry agent URL to resolve the active image digest for a plan.
    default: ""
outputs:
  backend-release:
    description: Non-secret backend version, image and target metadata after apply or a verified no-op deployment.
    value: ${{ steps.terraform.outputs.backend-release }}
runs:
  using: composite
  steps:
    - name: Initialize, plan, verify, and optionally apply
      id: terraform
      shell: bash
      env:
        TF_ROOT: ${{ inputs.terraform-root }}
        TARGET_ENVIRONMENT: ${{ inputs.environment }}
        STATE_ACCOUNT: ${{ inputs.state-account }}
        STATE_CONTAINER: ${{ inputs.state-container }}
        STATE_KEY: ${{ inputs.state-key }}
        REQUIRE_SIGNING_KEY: ${{ inputs.require-session-signing-key }}
        REQUIRE_EXISTING_STATE: ${{ inputs.require-existing-state }}
        EXPECTED_RESOURCE_GROUP: ${{ inputs.expected-resource-group }}
        APPLY: ${{ inputs.apply }}
        IMAGE_DIGEST: ${{ inputs.image-digest }}
        BRIDGE_IMAGE_DIGEST: ${{ inputs.bridge-image-digest }}
        FOUNDRY_AGENT_URL: ${{ inputs.foundry-agent-url }}
      run: |
        set -euo pipefail

        fail() {
          local message=$1 log=${2:-}
          # Publish only a known-safe Terraform title, not the contents of the diagnostic log.
          if [[ -n "$log" ]] && grep -Fqx 'Error: Error acquiring the state lock' "$log"; then
            message="$message Error acquiring the state lock. Check for an active Terraform run or contact the state owner if the lock persists."
          fi
          printf '::error::%s\n' "$message"
          printf '\n### Terraform check failed\n\n%s\n' "$message" >> "$GITHUB_STEP_SUMMARY"
          exit 1
        }

        : "${ARM_CLIENT_ID:?Required Azure client ID}" "${ARM_TENANT_ID:?Required Azure tenant ID}" \
          "${ARM_SUBSCRIPTION_ID:?Required Azure subscription ID}" "${STATE_ACCOUNT:?Required state account}" \
          "${STATE_CONTAINER:?Required state container}" "${STATE_KEY:?Required state key}"
        if [[ "$REQUIRE_SIGNING_KEY" == true ]]; then
          : "${TF_VAR_session_signing_key:?Required frontend session signing key}"
        fi
        if [[ ! "$APPLY" =~ ^(true|false)$ || ! "$REQUIRE_EXISTING_STATE" =~ ^(true|false)$ ||
          ! "$TARGET_ENVIRONMENT" =~ ^[a-z]{3}$ ]]; then
          echo "::error::Invalid apply, existing-state, or environment configuration."
          exit 1
        fi
        if [[ "$APPLY" == true && ( "$GITHUB_EVENT_NAME" != push ||
          "$GITHUB_REF" != refs/heads/main || -z "$EXPECTED_RESOURCE_GROUP" ) ]]; then
          echo "::error::Apply requires an explicitly configured Terraform target and a main push."
          exit 1
        fi
        workspace=$(realpath -e -- "$GITHUB_WORKSPACE")
        for path in "$TF_ROOT" "$TF_ROOT/$TARGET_ENVIRONMENT.tfvars"; do
          resolved=$(realpath -e -- "$path")
          if [[ "$path" == /* || "$resolved" != "$workspace/$path" ]]; then
            echo "::error::Terraform paths must be canonical repository-relative paths without symlinks."
            exit 1
          fi
        done
        if ! az account show --output json |
          jq -e '.id == env.ARM_SUBSCRIPTION_ID and .tenantId == env.ARM_TENANT_ID' > /dev/null; then
          echo "::error::Authenticated Azure tenant/subscription does not match the configured target."
          exit 1
        fi
        {
          echo "Terraform target: tenant $ARM_TENANT_ID; subscription $ARM_SUBSCRIPTION_ID; environment $TARGET_ENVIRONMENT."
          echo "Resource group: ${EXPECTED_RESOURCE_GROUP:-selected by root inputs}. Backend: $STATE_ACCOUNT/$STATE_CONTAINER/$STATE_KEY."
          echo "Apply enabled: $APPLY. Azure changes may incur charges; Terraform does not provide a cost estimate."
        } >> "$GITHUB_STEP_SUMMARY"
        if [[ "$REQUIRE_EXISTING_STATE" == true ]]; then
          if ! state_exists=$(az storage blob exists --auth-mode login \
            --account-name "$STATE_ACCOUNT" --container-name "$STATE_CONTAINER" \
            --name "$STATE_KEY" --query exists --output tsv --only-show-errors); then
            echo "::error::Cannot verify the required state blob. Check identity-based backend access."
            exit 1
          fi
          if [[ "$state_exists" != true ]]; then
            echo "::error::Required state blob is missing. Complete the separately approved state migration before running this pipeline."
            exit 1
          fi
        fi
        umask 077
        DIRECTORY=$(mktemp -d "$RUNNER_TEMP/terraform-plan.XXXXXX")
        trap 'rm -rf -- "$DIRECTORY"' EXIT
        export TF_DATA_DIR="$DIRECTORY/data"
        if ! terraform -chdir="$TF_ROOT" init -lockfile=readonly -no-color \
          -backend-config="storage_account_name=$STATE_ACCOUNT" \
          -backend-config="container_name=$STATE_CONTAINER" \
          -backend-config="key=$STATE_KEY" > "$DIRECTORY/init.log" 2>&1; then
          fail "Terraform remote initialization failed. Check OIDC, backend inputs, and the committed lockfile." "$DIRECTORY/init.log"
        fi
        if [[ -n "$FOUNDRY_AGENT_URL" ]]; then
          if [[ "$APPLY" == true || -n "$IMAGE_DIGEST" ||
            ! "$FOUNDRY_AGENT_URL" =~ ^https://[a-zA-Z0-9-]+\.services\.ai\.azure\.com/api/projects/[a-zA-Z0-9_-]+/agents/[a-zA-Z0-9_-]+$ ]]; then
            echo "::error::Foundry image lookup requires a valid agent URL and a plan without an explicit image digest."
            exit 1
          fi
          if ! state_image=$(terraform -chdir="$TF_ROOT" output -raw image_uri 2>"$DIRECTORY/output.log") ||
            [[ ! "$state_image" =~ ^[a-z0-9.-]+/[a-z0-9._/-]+@sha256:[0-9a-f]{64}$ ]]; then
            fail "Terraform state must contain the existing agent image URI."
          fi
          # Use the live digest; state can lag an out-of-band publication.
          if ! baseline=$(az rest --method get --url "$FOUNDRY_AGENT_URL?api-version=v1" --resource https://ai.azure.com \
            --output json --only-show-errors 2>"$DIRECTORY/foundry.log" |
            jq -er --arg repo "${state_image%@*}" '
              .versions.latest | select(.status == "active") |
              .definition.container_configuration.image | strings |
              select(startswith($repo + "@")) | ltrimstr($repo + "@")
            '); then
            echo "::error::The latest Foundry version must be active and use the same image repository as state."
            exit 1
          fi
          IMAGE_DIGEST="$baseline"
        fi
        if [[ -n "$IMAGE_DIGEST" || -n "$FOUNDRY_AGENT_URL" ]]; then
          if [[ ! "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Expected a published container image digest."
            exit 1
          fi
          export TF_VAR_container_image_digest="$IMAGE_DIGEST"
        fi
        if [[ "$TF_ROOT" == "infra/frontend" && "$APPLY" == true ]]; then
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ &&
            "$BRIDGE_IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || {
              echo "::error::Frontend apply requires published frontend and bridge image digests."
              exit 1
            }
          export TF_VAR_bridge_image_digest="$BRIDGE_IMAGE_DIGEST"
          export TF_VAR_deployment_timestamp="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
        elif [[ -n "$BRIDGE_IMAGE_DIGEST" ]]; then
          echo "::error::A bridge image digest is only valid for frontend apply."
          exit 1
        fi
        plan_status=0
        terraform -chdir="$TF_ROOT" plan -var-file="$TARGET_ENVIRONMENT.tfvars" \
          -detailed-exitcode -lock-timeout=60s -no-color -out="$DIRECTORY/terraform.tfplan" \
          > "$DIRECTORY/plan.log" 2>&1 || plan_status=$?
        [[ "$plan_status" == 0 || "$plan_status" == 2 ]] ||
          fail "Terraform plan failed." "$DIRECTORY/plan.log"
        if ! terraform -chdir="$TF_ROOT" show -json "$DIRECTORY/terraform.tfplan" \
          > "$DIRECTORY/plan.json" 2> "$DIRECTORY/show.log"; then
          fail "Cannot read the private Terraform plan."
        fi
        if ! jq -r --arg root "$TF_ROOT" --arg environment "$TARGET_ENVIRONMENT" '
          def markdown:
            @html | gsub("\\|"; "&#124;") | gsub("`"; "&#96;") |
            gsub("\r"; "&#13;") | gsub("\n"; "&#10;");
          [.resource_changes[]? | select(.change.actions != ["no-op"])] as $changes |
          [$changes[] | select(.mode == "managed")] as $managed |
          [
            "",
            "### Terraform plan: \($root | markdown) / \($environment | markdown)",
            "",
            "Plan: \([$managed[] | select(.change.actions | index("create"))] | length) to add, " +
              "\([$managed[] | select(.change.actions | index("update"))] | length) to change, " +
              "\([$managed[] | select(.change.actions | index("delete"))] | length) to destroy.",
            "",
            "Replacements count as both add and destroy. The detailed plan follows after target verification.",
            "",
            (if $changes | length == 0 then "No resource changes." else
              "| Resource | Actions |", "| --- | --- |",
              ($changes[] | "| \(.address | markdown) | \(.change.actions | join(" -> ") | markdown) |")
            end),
            ""
          ] | join("\n")
          ' "$DIRECTORY/plan.json" > "$DIRECTORY/summary.md" 2> "$DIRECTORY/summary.log"; then
          fail "Cannot generate the sanitized Terraform plan summary."
        fi
        if ! jq -e '
          def backend_target($subscription; $group):
            "aif-ski-foundry-dev-ncus.services.ai.azure.com/api/projects/proj-ski-foundry-dev-ncus" as $project |
            ($subscription + "/resourcegroups/rg-ski-gateway-dev-eus2/providers/microsoft.apimanagement/aigateways/aig-ski-gateway-dev-eus2/workspaces/default/aliases/ski-assistant-dev") as $alias |
            ($group + "/providers/microsoft.insights/components/appi-ski-foundry-dev-ncus") as $insights |
            env.TARGET_ENVIRONMENT == "dev" and env.EXPECTED_RESOURCE_GROUP == "rg-ski-foundry-dev-ncus" and
            .variables.project_endpoint.value == ("https://" + $project) and
            .variables.agent_name.value == "ski-backend-dev" and
            (env.APPLY == "true" or env.FOUNDRY_AGENT_URL == ("https://" + $project + "/agents/ski-backend-dev")) and
            .variables.acr_login_server.value == "crskiregistrydevncus.azurecr.io" and
            .variables.container_image_repository.value == "ski-backend" and
            (env.TF_VAR_container_image_digest // "" | test("^sha256:[0-9a-f]{64}$")) and
            .variables.container_image_digest.value == env.TF_VAR_container_image_digest and
            all(.resource_changes[]? | select(.mode == "managed");
              (.change.actions | index("delete") | not) and
              (.change.after as $after |
                ($after.parent_id // "" | ascii_downcase) as $parent |
                if .address == "module.agent.azapi_data_plane_resource.this" then
                  $after.type == "Microsoft.Foundry/agents@v1" and
                  $after.name == "ski-backend-dev" and $parent == $project
                elif $after.type == "Microsoft.Authorization/roleAssignments@2022-04-01" then
                  ($after.body | if type == "string" then fromjson else . end | .properties.roleDefinitionId | ascii_downcase) as $role |
                  ($subscription + "/providers/microsoft.authorization/roledefinitions/") as $role_prefix |
                  (.address == "module.agent_gateway_caller.azapi_resource.this" and $parent == $alias and
                    $role == ($role_prefix + "a6b68e3d-a1f0-4c60-8678-237c050cf4ea")) or
                  (.address == "module.agent_telemetry_publisher.azapi_resource.this" and $parent == $insights and
                    $role == ($role_prefix + "3913510d-42f4-4e42-8a64-420c390055eb"))
                else false end
              )
            );
          def frontend_target($acr; $agent):
            env.TARGET_ENVIRONMENT == "dev" and env.EXPECTED_RESOURCE_GROUP == "rg-ski-frontend-dev-ncus" and
            ([.variables.acr_resource_id.value, .variables.foundry_agent_resource_id.value] | map(ascii_downcase)) == [$acr, $agent] and
            [.variables.container_image_repository.value, .variables.bridge_image_repository.value] == ["ski-school/frontend", "ski-school/bridge"] and
            (env.APPLY != "true" or (
              ([env.TF_VAR_container_image_digest, env.TF_VAR_bridge_image_digest] | all(.[]; test("^sha256:[0-9a-f]{64}$"))) and
              [.variables.container_image_digest.value, .variables.bridge_image_digest.value] == [env.TF_VAR_container_image_digest, env.TF_VAR_bridge_image_digest]
            ));
          def frontend_scope($subscription; $acr; $agent; $parent; $resource):
            env.TF_ROOT == "infra/frontend" and env.TARGET_ENVIRONMENT == "dev" and
            $resource.type == "Microsoft.Authorization/roleAssignments@2022-04-01" and
            (($resource.body | if type == "string" then fromjson else . end | .properties.roleDefinitionId | ascii_downcase) as $role |
              ($subscription + "/providers/microsoft.authorization/roledefinitions/") as $prefix |
              (.address == "module.aca.azapi_resource.acr_pull_role_assignment" and $parent == $acr and
                ($role == ($prefix + "b93aa761-3e63-49ed-ac28-beffa264f7ac") or $role == ($prefix + "7f951dda-4ed3-4680-a7ca-43fe172d538d"))) or
              (.address == "module.aca.azapi_resource.foundry_agent_consumer" and $parent == $agent and
                $role == ($prefix + "eed3b665-ab3a-47b6-8f48-c9382fb1dad6"))
            );
          ("/subscriptions/" + env.ARM_SUBSCRIPTION_ID | ascii_downcase) as $subscription |
          ($subscription + "/resourcegroups/" + (env.EXPECTED_RESOURCE_GROUP | ascii_downcase)) as $group |
          (.variables.telemetry_exporter.value.data_collection_rule_id // "" | ascii_downcase) as $dcr |
          (.variables.project_acr_connection.value.registry_id // "" | ascii_downcase) as $acr |
          ($subscription + "/resourcegroups/rg-ski-registry-dev-ncus/providers/microsoft.containerregistry/registries/crskiregistrydevncus") as $frontend_acr |
          ($subscription + "/resourcegroups/rg-ski-foundry-dev-ncus/providers/microsoft.cognitiveservices/accounts/aif-ski-foundry-dev-ncus/projects/proj-ski-foundry-dev-ncus/agents/ski-backend-dev") as $frontend_agent |
          .errored != true and
          .variables.subscription_id.value == env.ARM_SUBSCRIPTION_ID and
          .variables.environment.value == env.TARGET_ENVIRONMENT and
          (if env.TF_ROOT == "infra/backend" then
            .variables.tenant_id.value == env.ARM_TENANT_ID and backend_target($subscription; $group)
          elif env.EXPECTED_RESOURCE_GROUP == "" and env.TF_ROOT != "infra/frontend" then true else
            (.variables.tenant_id.value == env.ARM_TENANT_ID or
              (env.TF_ROOT == "infra/frontend" and .variables.tenant_id == null)) and
            (.planned_values.outputs.resource_group_id.value | ascii_downcase) == $group and
            (env.TF_ROOT != "infra/frontend" or frontend_target($frontend_acr; $frontend_agent)) and
            all(.resource_changes[]? | select(.mode == "managed");
              (.change.actions | index("delete") | not) and
              (.change.after as $after |
                ($after.parent_id // "" | ascii_downcase) as $parent |
                ($parent == $group or ($parent | startswith($group + "/"))) or
                (($after.type | startswith("Microsoft.Resources/resourceGroups@")) and
                  $after.name == env.EXPECTED_RESOURCE_GROUP and
                  $parent == $subscription) or
                (env.TF_ROOT == "infra/gateway" and
                  ($after.type | startswith("Microsoft.Authorization/roleAssignments@")) and
                  $parent == $dcr and
                  $parent != "") or
                # Foundry owns the project identity pull grant on the separately managed dev registry.
                (env.TF_ROOT == "infra/foundry" and
                  env.TARGET_ENVIRONMENT == "dev" and
                  .address == "module.project_acr_image_pull[\"backend\"].azapi_resource.this" and
                  ($after.type | startswith("Microsoft.Authorization/roleAssignments@")) and
                  $parent == $acr and
                  $parent == ($subscription + "/resourcegroups/rg-ski-registry-dev-ncus/providers/microsoft.containerregistry/registries/crskiregistrydevncus")) or
                frontend_scope($subscription; $frontend_acr; $frontend_agent; $parent; $after)
              )
            )
          end)' "$DIRECTORY/plan.json" > /dev/null 2> "$DIRECTORY/guard.log"; then
          if [[ "$TF_ROOT" == "infra/frontend" ]]; then
            {
              echo '### Frontend plan guard diagnostics'
              echo 'The following checks omit planned values and secrets.'
              if ! jq -r '
                "subscription_id_matches=\(.variables.subscription_id.value == env.ARM_SUBSCRIPTION_ID)",
                "tenant_id_matches=\(.variables.tenant_id.value == env.ARM_TENANT_ID or .variables.tenant_id == null)",
                "environment_matches=\(.variables.environment.value == env.TARGET_ENVIRONMENT)",
                "resource_group_output_matches=\(try ((.planned_values.outputs.resource_group_id.value | ascii_downcase) == ("/subscriptions/" + (env.ARM_SUBSCRIPTION_ID | ascii_downcase) + "/resourcegroups/" + (env.EXPECTED_RESOURCE_GROUP | ascii_downcase))) catch false)",
                "frontend_targets_match=\(try ([.variables.acr_resource_id.value, .variables.foundry_agent_resource_id.value] | map(ascii_downcase)) == [("/subscriptions/" + (env.ARM_SUBSCRIPTION_ID | ascii_downcase) + "/resourcegroups/rg-ski-registry-dev-ncus/providers/microsoft.containerregistry/registries/crskiregistrydevncus"), ("/subscriptions/" + (env.ARM_SUBSCRIPTION_ID | ascii_downcase) + "/resourcegroups/rg-ski-foundry-dev-ncus/providers/microsoft.cognitiveservices/accounts/aif-ski-foundry-dev-ncus/projects/proj-ski-foundry-dev-ncus/agents/ski-backend-dev")]) catch false)",
                "image_repositories_match=\(try ([.variables.container_image_repository.value, .variables.bridge_image_repository.value] == ["ski-school/frontend", "ski-school/bridge"]) catch false)",
                "managed_resource_changes=\([.resource_changes[]? | select(.mode == "managed") | "\(.address) [\(.change.actions | join(","))]"] | join(", "))"
              ' "$DIRECTORY/plan.json" | tee -a "$GITHUB_STEP_SUMMARY"; then
                echo 'Plan diagnostics were unavailable.' >> "$GITHUB_STEP_SUMMARY"
              fi
            } 2>/dev/null
          fi
          fail "Terraform plan target verification failed, or the plan includes a deletion, replacement, or unapproved scope."
        fi
        if ! terraform -chdir="$TF_ROOT" show -no-color "$DIRECTORY/terraform.tfplan" \
          > "$DIRECTORY/plan.txt" 2> "$DIRECTORY/show-text.log"; then
          fail "Cannot render the private Terraform plan."
        fi
        if ! python3 - "$DIRECTORY/plan.json" "$DIRECTORY/plan.txt" "$DIRECTORY/detail.md" <<'PY'
        import json
        import re
        import sys
        from pathlib import Path

        with open(sys.argv[1], encoding="utf-8") as source:
            plan = json.load(source)
        text = Path(sys.argv[2]).read_text(encoding="utf-8")
        confidential = re.compile(
            r"(?i)(secret|password|token|credential|authorization|connection.?string|"
            r"endpoint|hostname|fqdn|(?:api|access|private|signing)[_-]?key|^key$|^url$)"
        )
        values = set()

        def collect(value):
            if isinstance(value, str) and value:
                values.add(value)
                try:
                    nested = json.loads(value)
                except (ValueError, TypeError):
                    return
                if isinstance(nested, (dict, list)):
                    scan(nested)
            elif isinstance(value, dict):
                for child in value.values():
                    collect(child)
            elif isinstance(value, list):
                for child in value:
                    collect(child)

        def marked(value, sensitivity):
            if sensitivity is True:
                collect(value)
            elif isinstance(value, dict) and isinstance(sensitivity, dict):
                for key, child in value.items():
                    marked(child, sensitivity.get(key))
            elif isinstance(value, list) and isinstance(sensitivity, list):
                for child, flag in zip(value, sensitivity):
                    marked(child, flag)

        def scan(value):
            if isinstance(value, dict):
                if value.get("sensitive") is True and "value" in value:
                    collect(value["value"])
                for key, child in value.items():
                    if confidential.search(key):
                        collect(child)
                    scan(child)
                for prefix in ("before", "after"):
                    marked(value.get(prefix), value.get(prefix + "_sensitive"))
            elif isinstance(value, list):
                for child in value:
                    scan(child)
            elif isinstance(value, str) and value[:1] in ("{", "["):
                try:
                    nested = json.loads(value)
                except ValueError:
                    return
                if isinstance(nested, (dict, list)):
                    scan(nested)

        scan(plan)
        for value in sorted(values, key=len, reverse=True):
            # Match both ordinary and escaped Terraform string representations.
            encoded = json.dumps(value, ensure_ascii=False)[1:-1]
            for candidate in {value, encoded, encoded.replace('"', r'\"')}:
                if candidate:
                    text = text.replace(candidate, "[REDACTED]")
        text = re.sub(r"(?i)\bhttps?://[^\s\"'<>`\\]+", "[REDACTED URL]", text)
        fence = "`" * max(3, max((len(run) for run in re.findall(r"`+", text)), default=0) + 1)
        detail = "\n### Detailed Terraform plan\n\nSensitive values and endpoints are redacted.\n\n"
        detail += f"{fence}terraform\n{text.rstrip()}\n{fence}\n"
        if len(detail.encode("utf-8")) > 900_000:
            raise SystemExit("Detailed plan exceeds the safe job summary size.")
        Path(sys.argv[3]).write_text(detail, encoding="utf-8")
        PY
        then
          fail "Cannot safely redact the Terraform plan."
        fi
        cat "$DIRECTORY/summary.md" "$DIRECTORY/detail.md" >> "$GITHUB_STEP_SUMMARY"
        echo "Redacted Terraform plan:"
        cat "$DIRECTORY/summary.md" "$DIRECTORY/detail.md"
        echo "Terraform plan verified. Private plan and diagnostics are not published." >> "$GITHUB_STEP_SUMMARY"

        if [[ "$APPLY" == true ]]; then
          if [[ "$plan_status" == 0 ]]; then
            echo "Terraform apply skipped: the verified plan has no changes." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            terraform -chdir="$TF_ROOT" apply -input=false -lock-timeout=60s -no-color \
              "$DIRECTORY/terraform.tfplan" > "$DIRECTORY/apply.log" 2>&1 ||
              fail "Terraform apply failed." "$DIRECTORY/apply.log"
            echo "Terraform apply completed using the verified artifact-source plan." >> "$GITHUB_STEP_SUMMARY"
          fi
          if [[ "$TF_ROOT" == infra/backend ]]; then
            if ! release=$(terraform -chdir="$TF_ROOT" output -json 2>"$DIRECTORY/output.log" | jq -ce '
              {agent: .agent_name.value, version: .candidate_version.value, image: .image_uri.value, endpoint: .project_endpoint.value} |
              select(.agent == "ski-backend-dev" and
                (.version | test("^[1-9][0-9]*$")) and
                .image == ("crskiregistrydevncus.azurecr.io/ski-backend@" + env.TF_VAR_container_image_digest) and
                .endpoint == "https://aif-ski-foundry-dev-ncus.services.ai.azure.com/api/projects/proj-ski-foundry-dev-ncus"
              )'); then
              fail "Current Terraform state did not return valid backend release metadata."
            fi
            printf 'backend-release=%s\n' "$release" >> "$GITHUB_OUTPUT"
          fi
        fi
