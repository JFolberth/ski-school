name: Reusable Terraform CI

on:
  workflow_call:
    inputs:
      terraform-root:
        type: string
        default: infra/frontend
      module-path:
        type: string
        default: infra/modules/aca
      environments:
        description: JSON target objects with name, state_storage_account, state_container, and (for gateway) expected_resource_group.
        type: string
        default: >-
          [{"name":"dev","state_storage_account":"saterraformstatedevswece","state_container":"tfstate"}]
      state-key:
        description: Environment-neutral state blob key for this Terraform root.
        type: string
        required: true
      artifact-prefix:
        type: string
        default: frontend-ci
      retention-days:
        type: number
        default: 7
      require-session-signing-key:
        type: boolean
        default: true
      deployment-source:
        description: Publish one artifact-only gateway deployment bundle for all selected environments after CI succeeds.
        type: boolean
        default: false
      modules-artifact-id:
        description: Shared modules artifact from this orchestration; omit with its digest for legacy module-path publication. Required for deployment source.
        type: string
        default: ""
      modules-artifact-digest:
        description: SHA-256 digest of the shared modules archive.
        type: string
        default: ""
    secrets:
      FRONTEND_SESSION_SIGNING_KEY:
        description: Existing ephemeral session key; required only for frontend plans.
        required: false
    outputs:
      deployment-artifact-id:
        description: Immutable deployment-source ID from successful main CI only.
        value: ${{ jobs.publish.outputs.artifact-id }}
      deployment-artifact-digest:
        description: SHA-256 archive digest from successful main CI only.
        value: ${{ jobs.publish.outputs.artifact-digest }}
      deployment-environments:
        description: Full verified target manifest from successful main CI only.
        value: ${{ jobs.publish.outputs.environments }}

permissions:
  contents: read

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  configure:
    name: Validate Terraform environment configuration
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      environments: ${{ steps.targets.outputs.environments }}
    steps:
      - name: Validate selected targets before matrix expansion
        id: targets
        env:
          ENVIRONMENTS: ${{ inputs.environments }}
          DEPLOYMENT_SOURCE: ${{ inputs.deployment-source }}
          TF_ROOT: ${{ inputs.terraform-root }}
          MODULE_PATH: ${{ inputs.module-path }}
          MODULES_ARTIFACT_ID: ${{ inputs.modules-artifact-id }}
          MODULES_ARTIFACT_DIGEST: ${{ inputs.modules-artifact-digest }}
        run: |
          set -euo pipefail
          if [[ "$DEPLOYMENT_SOURCE" == true &&
            ( "$TF_ROOT" != infra/gateway || "$MODULE_PATH" != infra/modules ) ]]; then
            echo "::error::Deployment-source publication requires the gateway root and shared modules."
            exit 1
          fi
          if [[ ( "$DEPLOYMENT_SOURCE" == true || -n "$MODULES_ARTIFACT_ID" || -n "$MODULES_ARTIFACT_DIGEST" ) &&
            ( ! "$MODULES_ARTIFACT_ID" =~ ^[0-9]+$ || ! "$MODULES_ARTIFACT_DIGEST" =~ ^[a-f0-9]{64}$ ) ]]; then
            echo "::error::Shared modules require both this run's artifact ID and SHA-256 digest; deployment source requires them too."
            exit 1
          fi
          environments=$(jq -ce '
            if type == "array" and length > 0 and
              all(.[]; type == "object" and
                (.name | type == "string" and test("^[a-z]{3}$")) and
                (.state_storage_account | type == "string" and test("^[a-z0-9]{3,24}$")) and
                (.state_container | type == "string" and test("^[a-z0-9][a-z0-9-]{1,61}[a-z0-9]$") and (contains("--") | not)) and
                (if env.DEPLOYMENT_SOURCE == "true" then
                  (keys == ["expected_resource_group","name","state_container","state_storage_account"]) and
                  (.expected_resource_group | type == "string" and test("^[a-zA-Z0-9_-][a-zA-Z0-9_.()-]{0,89}$") and (endswith(".") | not))
                else true end)) and
              ([.[].name] | length == (unique | length)) and
              ([.[].state_storage_account] | length == (unique | length))
            then . else error("Require nonempty unique environments with isolated storage accounts and explicit gateway resource groups.") end
          ' <<< "$ENVIRONMENTS")
          echo "environments=$environments" >> "$GITHUB_OUTPUT"

  validate:
    name: Validate Terraform without Azure access
    needs: configure
    if: >-
      ${{ !((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' &&
      !endsWith(github.actor, '[bot]') &&
      github.event.pull_request.user.type != 'Bot' &&
      github.event.pull_request.head.repo.full_name == github.repository)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      TERRAFORM_ARTIFACT_SUFFIX: validation
    steps:
      - &checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - &setup-terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.15.5
          terraform_wrapper: false
      - &terraform-validate
        name: Check formatting and validate without backend access
        uses: ./.github/actions/terraform-validate
        with:
          terraform-root: ${{ inputs.terraform-root }}
      - &terraform-source
        name: Publish Terraform source artifact
        if: ${{ !inputs.deployment-source }}
        uses: ./.github/actions/upload-artifact
        with:
          name: ${{ inputs.artifact-prefix }}-terraform-source-${{ env.TERRAFORM_ARTIFACT_SUFFIX }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ inputs.terraform-root }}/*.tf
            ${{ inputs.terraform-root }}/.terraform.lock.hcl
            ${{ inputs.modules-artifact-id == '' && format('{0}/**/*.tf', inputs.module-path) || '' }}
          retention-days: ${{ inputs.retention-days }}
          include-hidden-files: "true"
      - &deployment-source
        name: Publish root source bound to shared modules
        id: source
        if: ${{ inputs.deployment-source }}
        uses: ./.github/actions/terraform-source-artifact
        with:
          terraform-root: ${{ inputs.terraform-root }}
          modules-artifact-id: ${{ inputs.modules-artifact-id }}
          modules-artifact-digest: ${{ inputs.modules-artifact-digest }}
          name: ${{ inputs.artifact-prefix }}-terraform-source-${{ github.run_id }}-${{ github.run_attempt }}
          state-key: ${{ inputs.state-key }}
          environments: ${{ needs.configure.outputs.environments }}
          retention-days: ${{ inputs.retention-days }}
      - name: Report planning eligibility
        run: |
          echo "Terraform plan: not eligible (untrusted event, fork, or bot PR). Only backend-free validation was performed." >> "$GITHUB_STEP_SUMMARY"

  plan:
    name: Validate and plan infrastructure (${{ matrix.environment.name }})
    needs: configure
    if: >-
      ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' &&
      !endsWith(github.actor, '[bot]') &&
      github.event.pull_request.user.type != 'Bot' &&
      github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        environment: ${{ fromJSON(needs.configure.outputs.environments) }}
    concurrency:
      group: terraform-${{ github.repository }}-${{ matrix.environment.state_storage_account }}-${{ matrix.environment.state_container }}-${{ inputs.state-key }}
      cancel-in-progress: false
    environment: ${{ matrix.environment.name }}
    permissions:
      contents: read
      id-token: write
    env:
      TERRAFORM_ARTIFACT_SUFFIX: ${{ matrix.environment.name }}
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      ARM_USE_OIDC: "true"
      ARM_USE_AZUREAD: "true"
      ARM_USE_CLI: "false"
      ARM_SKIP_PROVIDER_REGISTRATION: "true"
      AZAPI_LOG_SENSITIVE_DATA: "false"
      AZURE_CORE_OUTPUT: none
    steps:
      - *checkout
      - *setup-terraform
      - *terraform-validate
      - *terraform-source
      - uses: Azure/login@v3
        with:
          client-id: ${{ env.ARM_CLIENT_ID }}
          tenant-id: ${{ env.ARM_TENANT_ID }}
          subscription-id: ${{ env.ARM_SUBSCRIPTION_ID }}
      - name: Check Terraform plan
        uses: ./.github/actions/terraform-plan-artifact
        with:
          terraform-root: ${{ inputs.terraform-root }}
          environment: ${{ matrix.environment.name }}
          state-account: ${{ matrix.environment.state_storage_account }}
          state-container: ${{ matrix.environment.state_container }}
          state-key: ${{ inputs.state-key }}
          require-session-signing-key: ${{ inputs.require-session-signing-key }}
          expected-resource-group: ${{ matrix.environment.expected_resource_group || '' }}
        env:
          TF_VAR_session_signing_key: ${{ secrets.FRONTEND_SESSION_SIGNING_KEY }}

  publish:
    name: Publish verified Terraform source
    needs: [configure, plan]
    if: ${{ inputs.deployment-source && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      artifact-id: ${{ steps.deployment.outputs.artifact-id }}
      artifact-digest: ${{ steps.deployment.outputs.artifact-digest }}
      environments: ${{ steps.deployment.outputs.environments }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - *deployment-source
      - name: Expose deployment artifact only for main
        id: deployment
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        env:
          ARTIFACT_ID: ${{ steps.source.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.source.outputs.artifact-digest }}
          ENVIRONMENTS: ${{ needs.configure.outputs.environments }}
        run: |
          {
            echo "artifact-id=$ARTIFACT_ID"
            echo "artifact-digest=$ARTIFACT_DIGEST"
            echo "environments=$ENVIRONMENTS"
          } >> "$GITHUB_OUTPUT"
