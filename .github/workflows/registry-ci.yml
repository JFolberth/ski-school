name: Registry CI

on:
  pull_request:
    branches: [main]
    paths:
      - infra/registry/**
      - infra/modules/**

permissions:
  contents: read

concurrency:
  group: registry-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Path-filtered workflows must not be unconditional required checks for all PRs.
jobs:
  checks:
    name: Registry checks
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/reusable-terraform-checks.yml
    with:
      terraform-root: infra/registry
      state-key: ski-school-registry.tfstate
      artifact-prefix: registry-ci
      require-existing-state: true
      environments: >-
        [{"name":"dev","state_storage_account":"saterraformstatedevswece","state_container":"tfstate","expected_resource_group":"rg-ski-registry-dev-ncus"}]
