name: Logging CD

on:
  push:
    branches: [main]
    paths:
      - infra/logging/**
      - infra/modules/**

permissions:
  contents: read

concurrency:
  group: logging-cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    name: Logging checks
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/reusable-logging-checks.yml

  deploy:
    name: Logging Terraform CD
    needs: checks
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.checks.result == 'success' }}
    permissions:
      contents: read
      actions: read
      id-token: write
    uses: ./.github/workflows/reusable-terraform-deploy.yml
    with:
      artifact-id: ${{ needs.checks.outputs.artifact-id }}
      artifact-digest: ${{ needs.checks.outputs.artifact-digest }}
      modules-artifact-id: ${{ needs.checks.outputs.modules-artifact-id }}
      modules-artifact-digest: ${{ needs.checks.outputs.modules-artifact-digest }}
      environments: ${{ needs.checks.outputs.environments }}
      terraform-root: infra/logging
      artifact-prefix: logging-ci
      state-key: ski-school-logging.tfstate
      require-existing-state: true
