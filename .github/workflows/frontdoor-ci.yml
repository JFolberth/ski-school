name: Front Door CI

on:
  pull_request:
    branches: [main]
    paths:
      - infra/global/**
      - infra/modules/**
      - .github/workflows/frontdoor-ci.yml
      - .github/workflows/frontdoor-cd.yml
      - .github/workflows/reusable-terraform-*.yml
      - .github/actions/terraform-fmt/**
      - .github/actions/terraform-plan-artifact/**
      - .github/actions/terraform-source-artifact/**
      - .github/actions/terraform-validate/**
      - .github/actions/upload-artifact/**

permissions:
  contents: read

concurrency:
  group: global-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

# Path-filtered workflows must not be unconditional required checks for all PRs.
jobs:
  checks:
    name: Front Door checks
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/reusable-terraform-checks.yml
    with:
      terraform-root: infra/global
      state-key: ski-school-global.tfstate
      artifact-prefix: global-ci
      environments: >-
        [{"name":"dev","state_storage_account":"saterraformstatedevswece","state_container":"tfstate","expected_resource_group":"rg-ski-global-dev-gbl"}]
