name: Frontend CI

on:
  pull_request:
    branches: [main]
    paths:
      - src/frontend/**
      - infra/frontend/**
      - infra/modules/**
      - .github/workflows/frontend-ci.yml
      - .github/workflows/frontend-cd.yml
      - .github/workflows/reusable-frontend-*.yml
      - .github/workflows/reusable-terraform-*.yml
      - .github/actions/build-image-artifact/**
      - .github/actions/terraform-fmt/**
      - .github/actions/terraform-plan-artifact/**
      - .github/actions/terraform-source-artifact/**
      - .github/actions/terraform-validate/**
      - .github/actions/upload-artifact/**
permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.event.pull_request.number || github.ref }}
  # Let a running Terraform plan release its remote state lock.
  cancel-in-progress: false

# Path-filtered workflows must not be unconditional required checks for all PRs.
jobs:
  checks:
    name: Frontend checks
    permissions:
      contents: read
      actions: read
      id-token: write
    uses: ./.github/workflows/reusable-frontend-checks.yml
