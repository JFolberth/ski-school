name: Frontend CI

on:
  pull_request:
    branches: [main]
    paths:
      - src/frontend/**
      - infra/frontend/**
      - infra/modules/**
  push:
    branches: [main]
    paths:
      - src/frontend/**
      - infra/frontend/**
      - infra/modules/**

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.event.pull_request.number || github.ref }}
  # Let a running Terraform plan release its remote state lock.
  cancel-in-progress: false

# Path-filtered workflows must not be unconditional required checks for all PRs.
jobs:
  images:
    name: Frontend images
    uses: ./.github/workflows/reusable-frontend-build.yml

  modules:
    name: Shared Terraform modules
    uses: ./.github/workflows/reusable-terraform-modules.yml

  terraform:
    name: Frontend Terraform
    permissions:
      contents: read
      actions: read
      id-token: write
    uses: ./.github/workflows/reusable-terraform-plan.yml
    with:
      state-key: ski-school-frontend.tfstate
    secrets:
      FRONTEND_SESSION_SIGNING_KEY: ${{ secrets.FRONTEND_SESSION_SIGNING_KEY }}
