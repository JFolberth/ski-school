name: Registry CD

on:
  push:
    branches: [main]
    paths:
      - infra/registry/**
      - infra/modules/**

permissions:
  contents: read

concurrency:
  group: registry-cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    name: Registry checks
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/reusable-terraform-checks.yml
    with:
      terraform-root: infra/registry
      state-key: ski-school-registry.tfstate
      artifact-prefix: registry-ci
      require-existing-state: true
      environments: >-
        [{"name":"dev","state_storage_account":"saterraformstatedevswece","state_container":"tfstate","expected_resource_group":"rg-ski-registry-dev-ncus"}]

  deploy:
    name: Registry Terraform CD
    needs: checks
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.checks.result == 'success' }}
    permissions:
      contents: read
      actions: read
      id-token: write
    uses: ./.github/workflows/reusable-terraform-deploy.yml
    with:
      artifact-id: ${{ needs.checks.outputs.artifact-id }}
      artifact-digest: ${{ needs.checks.outputs.artifact-digest }}
      modules-artifact-id: ${{ needs.checks.outputs.modules-artifact-id }}
      modules-artifact-digest: ${{ needs.checks.outputs.modules-artifact-digest }}
      environments: ${{ needs.checks.outputs.environments }}
      terraform-root: infra/registry
      artifact-prefix: registry-ci
      state-key: ski-school-registry.tfstate
      require-existing-state: true
