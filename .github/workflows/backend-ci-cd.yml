name: Backend CI/CD

on:
  pull_request:
    branches: [main]
    paths: &backend-paths
      - src/backend/**
      - infra/backend/**
      - infra/modules/**
      - .github/workflows/backend-ci-cd.yml
      - .github/workflows/reusable-terraform-*.yml
      - .github/actions/**
  push:
    branches: [main]
    paths: *backend-paths

permissions:
  contents: read

concurrency:
  group: backend-ci-cd-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  image:
    name: Build and verify backend image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      artifact-id: ${{ steps.build.outputs.artifact-id }}
      artifact-digest: ${{ steps.build.outputs.artifact-digest }}
      image-id: ${{ steps.build.outputs.image-id }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - id: build
        uses: ./.github/actions/build-image-artifact
        with:
          image-name: backend
          context: src/backend
          dockerfile: src/backend/Dockerfile
          image-tag: ski-school-ci/backend:${{ github.sha }}
          artifact-prefix: backend-ci
          build-args: |
            PIP_INDEX_URL=https://packagefeedproxy.microsoft.io/pypi/simple/
            PIP_TRUSTED_HOST=packagefeedproxy.microsoft.io
      - name: Check backend dependencies and startup
        run: |
          image="ski-school-ci/backend:$GITHUB_SHA"
          docker run --rm --network none "$image" python -I -m pip check
          docker run --rm --network none \
            -e AI_GATEWAY_BASE_URL=https://example.invalid/models/openai/v1/ \
            -e AI_GATEWAY_MODEL_ALIAS=ci-smoke \
            "$image" python -I -c 'import runpy; runpy.run_path("main.py")["create_server"]()'

  validate:
    name: Validate backend Terraform offline
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.15.5
          terraform_wrapper: false
      - uses: ./.github/actions/terraform-validate
        with:
          terraform-root: infra/backend

  checks:
    name: Backend Azure Terraform plan
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/reusable-terraform-checks.yml
    with:
      terraform-root: infra/backend
      state-key: ski-school-backend.tfstate
      artifact-prefix: backend-ci
      require-existing-state: true
      foundry-agent-url: https://aif-ski-foundry-dev-ncus.services.ai.azure.com/api/projects/proj-ski-foundry-dev-ncus/agents/ski-backend-dev
      environments: >-
        [{"name":"dev","state_storage_account":"saterraformstatedevswece","state_container":"tfstate","expected_resource_group":"rg-ski-foundry-dev-ncus"}]

  publish:
    name: Publish verified backend image to ACR
    needs: [image, validate, checks]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: dev
    permissions:
      actions: read
      id-token: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - name: Require explicit release enablement
        env:
          BACKEND_RELEASE_ENABLED: ${{ vars.BACKEND_RELEASE_ENABLED }}
        run: |
          if [[ "$BACKEND_RELEASE_ENABLED" != true ]]; then
            echo "::error::Backend release is not enabled. Complete the documented dev setup before permitting ACR writes."
            exit 1
          fi
      - name: Download and verify the image artifact
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.image.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ needs.image.outputs.artifact-digest }}
          IMAGE_ID: ${{ needs.image.outputs.image-id }}
        run: |
          set -euo pipefail
          [[ "$ARTIFACT_ID" =~ ^[0-9]+$ && "$ARTIFACT_DIGEST" =~ ^[0-9a-f]{64}$ &&
             "$IMAGE_ID" =~ ^sha256:[0-9a-f]{64}$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID" |
            jq -e --arg id "$ARTIFACT_ID" --arg digest "$ARTIFACT_DIGEST" '
              (.id | tostring) == $id and .expired == false and
              .name == ("backend-ci-backend-" + env.GITHUB_RUN_ID + "-" + env.GITHUB_RUN_ATTEMPT) and
              .digest == ("sha256:" + $digest) and
              (.workflow_run.id | tostring) == env.GITHUB_RUN_ID and
              .workflow_run.head_sha == env.GITHUB_SHA and .workflow_run.head_branch == "main"
            ' >/dev/null
          archive="$RUNNER_TEMP/backend-image.zip"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" > "$archive"
          printf '%s  %s\n' "$ARTIFACT_DIGEST" "$archive" | sha256sum --check
          unzip -p "$archive" image.tar > "$RUNNER_TEMP/backend-image.tar"
          docker load --input "$RUNNER_TEMP/backend-image.tar"
          [[ "$(docker image inspect --format '{{.Id}} {{.Os}}/{{.Architecture}}' \
            "ski-school-ci/backend:$GITHUB_SHA")" == "$IMAGE_ID linux/amd64" ]]
      - uses: Azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Push image and capture registry digest
        id: push
        env:
          AZURE_CORE_OUTPUT: none
        run: |
          set -euo pipefail
          az account show -o json | jq -e '
            .id == "9a7e9255-7824-4c0d-a414-366f436f61dd" and
            .tenantId == "5a4de383-e76f-4737-9623-e6281d36d202"
          ' >/dev/null
          registry=crskiregistrydevncus
          tag="$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          image="$registry.azurecr.io/ski-backend:$tag"
          az acr login --name "$registry" --only-show-errors
          docker tag "ski-school-ci/backend:$GITHUB_SHA" "$image"
          docker push "$image"
          digest=$(az acr repository show --name "$registry" --image "ski-backend:$tag" \
            --query digest --output tsv --only-show-errors)
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy backend hosted agent
    needs: [checks, publish]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      actions: read
      id-token: write
    uses: ./.github/workflows/reusable-terraform-deploy.yml
    with:
      artifact-id: ${{ needs.checks.outputs.artifact-id }}
      artifact-digest: ${{ needs.checks.outputs.artifact-digest }}
      modules-artifact-id: ${{ needs.checks.outputs.modules-artifact-id }}
      modules-artifact-digest: ${{ needs.checks.outputs.modules-artifact-digest }}
      environments: ${{ needs.checks.outputs.environments }}
      terraform-root: infra/backend
      artifact-prefix: backend-ci
      state-key: ski-school-backend.tfstate
      require-existing-state: true
      image-digest: ${{ needs.publish.outputs.digest }}
