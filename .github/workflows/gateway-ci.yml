name: AI Gateway CI

on:
  pull_request:
    branches: [main]
    paths:
      - infra/gateway/**
      - infra/modules/**

permissions:
  contents: read

concurrency:
  group: gateway-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Path-filtered workflows must not be unconditional required checks for all PRs.
jobs:
  checks:
    name: Gateway checks
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/reusable-gateway-checks.yml
