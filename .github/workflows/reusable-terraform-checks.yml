name: Reusable Terraform checks and source

on:
  workflow_call:
    inputs:
      terraform-root:
        description: Repository-relative Terraform root to check and publish.
        type: string
        required: true
      state-key:
        description: Environment-neutral state blob key for this root.
        type: string
        required: true
      artifact-prefix:
        description: Root-specific prefix for source artifacts.
        type: string
        required: true
      environments:
        description: Environment and backend targets shared by source publication and Terraform checks.
        type: string
        required: true
      require-existing-state:
        description: Refuse plans against a missing state blob.
        type: boolean
        default: false
    outputs:
      artifact-id:
        description: Immutable root source artifact from successful checks in this run.
        value: ${{ jobs.source.outputs.artifact-id }}
      artifact-digest:
        description: SHA-256 digest of the root source archive.
        value: ${{ jobs.source.outputs.artifact-digest }}
      modules-artifact-id:
        description: Immutable shared modules artifact from this run.
        value: ${{ jobs.modules.outputs.artifact-id }}
      modules-artifact-digest:
        description: SHA-256 digest of the shared modules archive.
        value: ${{ jobs.modules.outputs.artifact-digest }}
      environments:
        description: Validated environment and backend manifest used by every check.
        value: ${{ jobs.checks.outputs.environments }}

permissions:
  contents: read

jobs:
  modules:
    name: Shared Terraform modules
    uses: ./.github/workflows/reusable-terraform-modules.yml

  checks:
    name: Terraform checks
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/reusable-terraform-plan.yml
    with:
      terraform-root: ${{ inputs.terraform-root }}
      module-path: infra/modules
      state-key: ${{ inputs.state-key }}
      artifact-prefix: ${{ inputs.artifact-prefix }}
      require-session-signing-key: false
      require-existing-state: ${{ inputs.require-existing-state }}
      publish-source: false
      environments: ${{ inputs.environments }}

  source:
    name: Publish Terraform source
    if: >-
      ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' &&
      !endsWith(github.actor, '[bot]') &&
      github.event.pull_request.user.type != 'Bot' &&
      github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      artifact-id: ${{ steps.source.outputs.artifact-id }}
      artifact-digest: ${{ steps.source.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Publish root source for this revision
        id: source
        uses: ./.github/actions/terraform-source-artifact
        with:
          terraform-root: ${{ inputs.terraform-root }}
          name: ${{ inputs.artifact-prefix }}-terraform-source-${{ github.run_id }}-${{ github.run_attempt }}
          state-key: ${{ inputs.state-key }}
          environments: ${{ inputs.environments }}
